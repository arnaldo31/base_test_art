name: Run SeleniumBase Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  seleniumbase-tests:
    runs-on: ubuntu-22.04  # 👈 Use Ubuntu 22.04 for Python 3.7 compatibility

    strategy:
      matrix:
        python-version: [3.11]  # 👈 Removed 3.7 (or use ubuntu-22.04 to keep it)

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install seleniumbase==4.37.2

    - name: Install Google Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt install -y ./google-chrome-stable_current_amd64.deb

    - name: Install ChromeDriver via SeleniumBase
      run: seleniumbase install chromedriver

    - name: Run SeleniumBase Test
      run: |
        python -m pytest examples/boilerplates/boilerplate_test.py --browser=chrome --headless -v
